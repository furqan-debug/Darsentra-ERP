services:
  db:
    image: postgres:16-alpine
    container_name: darsentra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-darsentra_erp}
      POSTGRES_USER: ${POSTGRES_USER:-darsentra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darsentra_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darsentra_user} -d ${POSTGRES_DB:-darsentra_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - darsentra_internal
    # PostgreSQL is kept internal and inaccessible from the public network by default.
    # To expose port 5432 locally for DB management tools, use docker-compose.override.yml.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: darsentra_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-insecure-docker-dev-secret-key-replace-in-prod}
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${POSTGRES_DB:-darsentra_erp}
      - DB_USER=${POSTGRES_USER:-darsentra_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-darsentra_dev_password}
      - DB_HOST=db
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health/\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - darsentra_internal
      - darsentra_public

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: darsentra_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - darsentra_public

volumes:
  postgres_data:
    name: darsentra_postgres_data

networks:
  darsentra_internal:
    internal: true
  darsentra_public:
    driver: bridge
